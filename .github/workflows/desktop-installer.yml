name: Build Desktop Installers

"on":
  push:
    branches:
      - dev
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-installer-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '21'
  PNPM_VERSION: '10.30.3'
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
  BRAND_GITHUB_URL: https://github.com/${{ github.repository }}

jobs:
  build-macos:
    name: macOS installers
    runs-on: macos-15
    defaults:
      run:
        working-directory: mateclaw-desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Resolve pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache desktop dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.pnpm-store.outputs.path }}
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
            mateclaw-desktop/resources/jre
          key: ${{ runner.os }}-desktop-${{ hashFiles('mateclaw-desktop/pnpm-lock.yaml') }}-${{ hashFiles('mateclaw-desktop/scripts/download-jre.sh') }}
          restore-keys: |
            ${{ runner.os }}-desktop-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop app
        run: pnpm run build

      - name: Build backend JAR for personal client
        run: bash scripts/build.sh

      - name: Prepare macOS JREs for personal client
        run: bash scripts/download-jre.sh all

      - name: Detect macOS signing secrets
        id: mac-signing
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
        run: |
          if [ -n "${MAC_CSC_LINK:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build unsigned macOS enterprise remote x64 installer
        if: steps.mac-signing.outputs.enabled != 'true'
        shell: bash
        run: bash scripts/ci-electron-build.sh mac x64
        env:
          BUILD_MODE: remote
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Build unsigned macOS enterprise remote arm64 installer
        if: steps.mac-signing.outputs.enabled != 'true'
        shell: bash
        run: bash scripts/ci-electron-build.sh mac arm64
        env:
          BUILD_MODE: remote
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Build unsigned macOS personal x64 installer
        if: steps.mac-signing.outputs.enabled != 'true'
        shell: bash
        run: bash scripts/ci-electron-build.sh mac x64
        env:
          BUILD_MODE: local
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Build unsigned macOS personal arm64 installer
        if: steps.mac-signing.outputs.enabled != 'true'
        shell: bash
        run: bash scripts/ci-electron-build.sh mac arm64
        env:
          BUILD_MODE: local
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Build signed macOS enterprise remote x64 installer
        if: steps.mac-signing.outputs.enabled == 'true'
        shell: bash
        run: bash scripts/ci-electron-build.sh mac x64
        env:
          BUILD_MODE: remote
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build signed macOS enterprise remote arm64 installer
        if: steps.mac-signing.outputs.enabled == 'true'
        shell: bash
        run: bash scripts/ci-electron-build.sh mac arm64
        env:
          BUILD_MODE: remote
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build signed macOS personal x64 installer
        if: steps.mac-signing.outputs.enabled == 'true'
        shell: bash
        run: bash scripts/ci-electron-build.sh mac x64
        env:
          BUILD_MODE: local
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build signed macOS personal arm64 installer
        if: steps.mac-signing.outputs.enabled == 'true'
        shell: bash
        run: bash scripts/ci-electron-build.sh mac arm64
        env:
          BUILD_MODE: local
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload macOS installers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            mateclaw-desktop/release/*.dmg
            mateclaw-desktop/release/*.zip
            mateclaw-desktop/release/*.blockmap
            mateclaw-desktop/release/latest-mac.yml
            mateclaw-desktop/release/builder-debug.yml
            mateclaw-desktop/ci-logs/*.log

  build-windows:
    name: Windows installers
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mateclaw-desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Resolve pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache desktop dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.pnpm-store.outputs.path }}
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
            mateclaw-desktop/resources/jre
          key: ${{ runner.os }}-desktop-${{ hashFiles('mateclaw-desktop/pnpm-lock.yaml') }}-${{ hashFiles('mateclaw-desktop/scripts/download-jre.sh') }}
          restore-keys: |
            ${{ runner.os }}-desktop-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop app
        run: pnpm run build

      - name: Build backend JAR for personal client
        shell: bash
        run: bash scripts/build.sh

      - name: Prepare Windows JRE for personal client
        shell: bash
        run: bash scripts/download-jre.sh x64

      - name: Build Windows enterprise remote installer
        shell: bash
        run: bash scripts/ci-electron-build.sh win x64
        env:
          BUILD_MODE: remote
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Build Windows personal installer
        shell: bash
        run: bash scripts/ci-electron-build.sh win x64
        env:
          BUILD_MODE: local
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload Windows installers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            mateclaw-desktop/release/*.exe
            mateclaw-desktop/release/*.blockmap
            mateclaw-desktop/release/latest.yml
            mateclaw-desktop/release/builder-debug.yml
            mateclaw-desktop/ci-logs/*.log

  publish-dev-release:
    name: Publish latest desktop dev release
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    needs:
      - build-macos
      - build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish/update desktop-dev release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find release-assets -type f \
            \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \) \
            -print0)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No desktop installer assets found." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f desktop-dev "${GITHUB_SHA}"
          git push origin refs/tags/desktop-dev --force

          notes="Latest desktop dev installers built from ${GITHUB_SHA} on branch ${GITHUB_REF_NAME}. Includes 企业远程轻客户端 and 个人版客户端（完整本地客户端）."
          if gh release view desktop-dev >/dev/null 2>&1; then
            gh release edit desktop-dev \
              --title "Desktop Dev Build" \
              --notes "$notes" \
              --prerelease
            gh release view desktop-dev --json assets --jq '.assets[].name' | while IFS= read -r asset; do
              case "$asset" in
                *.dmg|*.zip|*.exe|*.blockmap|latest*.yml)
                  gh release delete-asset desktop-dev "$asset" -y || true
                  ;;
              esac
            done
            gh release upload desktop-dev "${files[@]}" --clobber
          else
            gh release create desktop-dev "${files[@]}" \
              --title "Desktop Dev Build" \
              --notes "$notes" \
              --prerelease \
              --target "${GITHUB_SHA}"
          fi

  publish-release:
    name: Publish tagged desktop release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-macos
      - build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches desktop package version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./mateclaw-desktop/package.json').version")"
          expected="v${version}"
          if [ "${GITHUB_REF_NAME}" != "$expected" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match mateclaw-desktop/package.json version ${version} (${expected})." >&2
            exit 1
          fi

      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish GitHub Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find release-assets -type f \
            \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \) \
            -print0)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No desktop installer assets found." >&2
            exit 1
          fi

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' | while IFS= read -r asset; do
              case "$asset" in
                *.dmg|*.zip|*.exe|*.blockmap|latest*.yml)
                  gh release delete-asset "${GITHUB_REF_NAME}" "$asset" -y || true
                  ;;
              esac
            done
            gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${files[@]}" \
              --title "MateClaw Desktop ${GITHUB_REF_NAME}" \
              --notes "Desktop installers built from ${GITHUB_SHA}. Includes 企业远程轻客户端 and 个人版客户端（完整本地客户端）."
          fi
